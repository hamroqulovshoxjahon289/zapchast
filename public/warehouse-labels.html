<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<script>(function(){var t=localStorage.getItem("theme")||"dark";document.documentElement.setAttribute("data-theme",t);})();</script>
<title>Ombor yorliqlari</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="css/style.css">
<style>
  .labels-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .label-card {
    border: 1px dashed #999; border-radius: 8px; padding: 12px;
    text-align: center; background: white; color: black; break-inside: avoid;
  }
  .label-card img { width: 130px; height: 130px; }
  .label-card .lname { font-weight: 700; font-size: 14px; margin-top: 6px; }
  .label-card .lcode { font-size: 11px; color: #555; }
  @media print { .labels-grid { grid-template-columns: repeat(3, 1fr); } }
</style>
</head>
<body>
<div class="topbar no-print">
  <h1><img src="assets/logo.png" class="logo" alt="logo"> <span>Temurshox mebel</span></h1>
  <div class="topbar-right"><div class="nav" id="nav"></div><button class="theme-toggle no-print" id="themeToggle" onclick="toggleTheme()" title="Rejimni almashtirish">☀️</button></div>
</div>
<div class="container">
  <div class="card no-print" id="printControls">
    <h2>🏷 Ombor zapchastlari yorliqlari</h2>
    <p class="muted">Har bir ombor zapchasti uchun QR-kod. Kesib olib jismoniy zapchastga yopishtiring.</p>
    <button class="btn" onclick="window.print()">🖨 Barchasini chop etish</button>
  </div>
  <div class="labels-grid" id="labelsGrid">Yuklanmoqda...</div>
</div>

<script src="js/common.js"></script>
<script>
renderNav('warehouse.html');
initThermalControls('printControls', 'labelsGrid');
async function load() {
  const items = await api('/api/warehouse');
  document.getElementById('labelsGrid').innerHTML = items.map(it => `
    <div class="label-card">
      <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(it.barcode)}">
      <div class="lname">${it.name}</div>
      <div class="lcode">Kod: ${it.code}</div>
    </div>
  `).join('') || '<p class="muted">Hali ombor zapchasti yo\'q</p>';
}
load();
</script>
</body>
</html>
