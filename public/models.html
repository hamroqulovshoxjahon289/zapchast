<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<title>Modellar</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="topbar">
  <h1>🪚 Temurshox mebel</h1>
  <div class="nav" id="nav"></div>
</div>
<div class="container">
  <div class="card" style="display:flex; justify-content:space-between; align-items:center;">
    <h2 style="margin:0">🗂 Kategoriya va modellar</h2>
    <button class="btn" onclick="openModal()">➕ Yangi model</button>
  </div>

  <div class="card">
    <label>Kategoriya bo'yicha filtrlash</label>
    <select id="filterCategory" onchange="renderTree()"><option value="">— Barchasi —</option></select>
    <div id="tree"></div>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal" style="max-width:680px">
    <h3 id="modalTitle">Yangi model</h3>
    <form onsubmit="return saveModel(event)">
      <input type="hidden" id="modelId">
      <label>Kategoriya</label>
      <select id="mCategory" required></select>
      <label>Model nomi</label>
      <input id="mName" required placeholder="masalan: Olma">
      <label>Kod (4 xonali)</label>
      <input id="mCode" maxlength="4" placeholder="avtomatik beriladi">
      <div style="display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;">
        <label style="margin:0">Ushbu modelga kerak bo'ladigan zapchastlar</label>
        <button type="button" class="btn secondary small" onclick="openTemplateModal()">📋 Tayyor shablondan foydalanish</button>
      </div>
      <div id="partsCheckList" style="max-height:340px; overflow-y:auto; border:1px solid var(--border); border-radius:8px; padding:10px; margin-top:6px;"></div>
      <div style="display:flex; gap:10px; margin-top:14px;">
        <button type="submit" class="btn">Saqlash</button>
        <button type="button" class="btn secondary" onclick="closeModal()">Bekor qilish</button>
      </div>
    </form>
  </div>
</div>

<div class="modal-overlay" id="templateModalOverlay">
  <div class="modal" style="max-width:420px">
    <h3>📋 Tayyor shablondan foydalanish</h3>
    <p class="muted" style="margin-top:-6px">Boshqa modeldagi zapchastlar ro'yxati va miqdorlarini shu yerga nusxalaysiz, so'ng kerakli joylarini o'zgartirib saqlaysiz.</p>
    <label>Kategoriya</label>
    <select id="tplCategory" onchange="loadTplModels()"></select>
    <label>Model (shablon sifatida)</label>
    <select id="tplModel"></select>
    <div style="display:flex; gap:10px; margin-top:14px;">
      <button type="button" class="btn" onclick="applyTemplate()">✔ Shablonni qo'llash</button>
      <button type="button" class="btn secondary" onclick="closeTemplateModal()">Bekor qilish</button>
    </div>
  </div>
</div>

<script src="js/common.js"></script>
<script>
renderNav('models.html');
let categories = [], parts = [], models = [];

async function loadAll() {
  [categories, parts, models] = await Promise.all([api('/api/categories'), api('/api/parts'), api('/api/models')]);
  const catSelect = document.getElementById('filterCategory');
  catSelect.innerHTML = '<option value="">— Barchasi —</option>' + categories.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
  document.getElementById('mCategory').innerHTML = categories.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
  renderTree();
}

function renderTree() {
  const filter = document.getElementById('filterCategory').value;
  const tree = document.getElementById('tree');
  const cats = filter ? categories.filter(c => String(c.id) === filter) : categories;
  if (!cats.length) { tree.innerHTML = '<p class="muted">Avval kategoriya qo\'shing</p>'; return; }
  tree.innerHTML = cats.map(c => {
    const catModels = models.filter(m => m.category_id === c.id);
    return `<div style="margin-top:16px">
      <h3 style="color:var(--accent2); margin-bottom:6px">${c.name}</h3>
      ${catModels.length ? `<table><thead><tr><th>Model</th><th>Kod</th><th>Zapchastlar soni</th><th></th></tr></thead><tbody>
        ${catModels.map(m => `<tr>
          <td>${m.name}</td>
          <td><span class="code-badge model-code">${m.code || '—'}</span></td>
          <td class="muted" id="pc-${m.id}">—</td>
          <td><button class="btn secondary small" onclick="editModel(${m.id})">Tahrirlash</button>
          <button class="btn danger small" onclick="delModel(${m.id})">O'chirish</button></td>
        </tr>`).join('')}
      </tbody></table>` : '<p class="muted">Model yo\'q</p>'}
    </div>`;
  }).join('');
  catModelsCountFetch(cats);
}

async function catModelsCountFetch(cats) {
  for (const c of cats) {
    const ms = models.filter(m => m.category_id === c.id);
    for (const m of ms) {
      const full = await api('/api/models/' + m.id);
      const el = document.getElementById('pc-' + m.id);
      if (el) el.textContent = full.parts.length + ' ta';
    }
  }
}

function renderPartsCheckList(selected = {}) {
  const container = document.getElementById('partsCheckList');
  container.innerHTML = parts.map(p => {
    const sel = selected[p.id];
    return `<div style="padding:8px; border-bottom:1px solid var(--border)">
      <div class="checkbox-row">
        <input type="checkbox" id="chk-${p.id}" ${sel ? 'checked' : ''} onchange="toggleExtra(${p.id})">
        <label style="margin:0"><strong>${p.name}</strong> <span class="muted">(${p.code})</span></label>
      </div>
      <div id="extra-${p.id}" style="display:${sel ? 'flex' : 'none'}; gap:8px; margin-left:26px;">
        ${p.has_quantity ? `<input type="number" step="any" placeholder="Soni" id="qty-${p.id}" value="${sel ? (sel.quantity ?? '') : ''}" style="margin:0">` : ''}
        ${p.has_weight ? `<input type="number" step="any" placeholder="Grammi" id="wt-${p.id}" value="${sel ? (sel.weight ?? '') : ''}" style="margin:0">` : ''}
        ${p.has_length ? `<input type="number" step="any" placeholder="Uzunligi" id="len-${p.id}" value="${sel ? (sel.length ?? '') : ''}" style="margin:0">` : ''}
      </div>
    </div>`;
  }).join('');
}

function toggleExtra(id) {
  const checked = document.getElementById('chk-' + id).checked;
  document.getElementById('extra-' + id).style.display = checked ? 'flex' : 'none';
}

async function openModal() {
  document.getElementById('modalTitle').textContent = 'Yangi model';
  document.getElementById('modelId').value = '';
  document.getElementById('mName').value = '';
  document.getElementById('mCategory').value = categories[0]?.id || '';
  renderPartsCheckList({});
  const r = await api('/api/models/next-code');
  document.getElementById('mCode').value = r.code;
  document.getElementById('modalOverlay').classList.add('show');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('show');
}

async function editModel(id) {
  const full = await api('/api/models/' + id);
  document.getElementById('modalTitle').textContent = 'Modelni tahrirlash';
  document.getElementById('modelId').value = full.id;
  document.getElementById('mName').value = full.name;
  document.getElementById('mCode').value = full.code || '';
  document.getElementById('mCategory').value = full.category_id;
  const selected = {};
  full.parts.forEach(p => selected[p.part_id] = p);
  renderPartsCheckList(selected);
  document.getElementById('modalOverlay').classList.add('show');
}

function openTemplateModal() {
  const currentCat = document.getElementById('mCategory').value;
  document.getElementById('tplCategory').innerHTML = categories.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
  document.getElementById('tplCategory').value = currentCat || (categories[0]?.id || '');
  loadTplModels();
  document.getElementById('templateModalOverlay').classList.add('show');
}

function closeTemplateModal() {
  document.getElementById('templateModalOverlay').classList.remove('show');
}

function loadTplModels() {
  const catId = document.getElementById('tplCategory').value;
  const ms = models.filter(m => String(m.category_id) === String(catId));
  document.getElementById('tplModel').innerHTML = ms.map(m =>
    `<option value="${m.id}">${m.name}${m.code ? ' (' + m.code + ')' : ''}</option>`
  ).join('') || '<option disabled>Bu kategoriyada model yo\'q</option>';
}

async function applyTemplate() {
  const tplId = document.getElementById('tplModel').value;
  if (!tplId) { toast('Shablon qilib oladigan model tanlang'); return; }
  const full = await api('/api/models/' + tplId);
  const selected = {};
  full.parts.forEach(p => selected[p.part_id] = p);
  renderPartsCheckList(selected);
  closeTemplateModal();
  toast(`"${full.name}" shabloni qo'llandi — endi kerakli joylarini o'zgartirib saqlang`);
}

async function saveModel(e) {
  e.preventDefault();
  const id = document.getElementById('modelId').value;
  if (id) {
    const ok = await askConfirmCode(
      "✏️ Tahrirlashni tasdiqlash",
      "O'zgarishlarni saqlash uchun quyidagi kodni kiriting"
    );
    if (!ok) return false;
  }
  const category_id = document.getElementById('mCategory').value;
  const name = document.getElementById('mName').value;
  const code = document.getElementById('mCode').value;
  const selectedParts = parts.filter(p => document.getElementById('chk-' + p.id)?.checked).map(p => ({
    part_id: p.id,
    quantity: p.has_quantity ? (parseFloat(document.getElementById('qty-' + p.id).value) || null) : null,
    weight: p.has_weight ? (parseFloat(document.getElementById('wt-' + p.id).value) || null) : null,
    length: p.has_length ? (parseFloat(document.getElementById('len-' + p.id).value) || null) : null,
  }));
  const body = JSON.stringify({ category_id, name, code, parts: selectedParts });
  try {
    if (id) {
      await api('/api/models/' + id, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body });
    } else {
      await api('/api/models', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body });
    }
    toast('Saqlandi');
    closeModal();
    loadAll();
  } catch (err) {
    toast(err.message);
  }
  return false;
}

async function delModel(id) {
  const model = models.find(m => m.id === id);
  const ok = await askConfirmCode(
    "🗑 Modelni o'chirish",
    `"${model ? model.name : ''}" o'chiriladi. Bu amalni bekor qilib bo'lmaydi.`
  );
  if (!ok) return;
  await api('/api/models/' + id, { method: 'DELETE' });
  toast('O\'chirildi');
  loadAll();
}

loadAll();
</script>
</body>
</html>
